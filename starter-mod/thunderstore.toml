[config]
schemaVersion = '0.0.1'

[package]
namespace = 'djcdevelopment'
name = 'HelloValheim'
versionNumber = '1.0.0'
description = 'Clone-and-go Valheim 1.0.20 (Deep North) starter mod demonstrating F5 console commands, live .cfg hot-reload, Harmony Finalizers, achievement state-passing, and Dedicated Server multiplayer safety.'
websiteUrl = 'https://github.com/djcdevelopment/valheim-modding-101'
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = '5.4.2202'

[build]
icon = './icon.png'
readme = '../README.md'
outdir = './dist'

[[build.copy]]
source = './bin/Release/HelloValheim.dll'
target = 'BepInEx/plugins/HelloValheim/HelloValheim.dll'

[publish]
repository = 'https://thunderstore.io'
communities = [ 'valheim' ]

[publish.categories]
valheim = [ 'mods', 'client-side', 'server-side', 'misc' ]
